name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (dsh 0.2.2 line)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm run build
      - run: pnpm test

  test-dsh-021:
    name: test (dsh 0.2.1-rc.3 line)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Builds a scenario tree pinned to the 0.2.1-rc.3 line (see the script)
      # and runs typecheck + build + the full suite against it.
      - run: scripts/test-dsh-021.sh
